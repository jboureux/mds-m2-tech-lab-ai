version: '3'

vars:
  DOCKER_COMPOSE: docker-compose

tasks:
  up:
    desc: Start the Docker development environment (App + DB)
    cmds:
      - |
        PORT={{.PORT | default "3000"}}
        # Tentative de récupération depuis CLI_ARGS si --port est passé (ex: task up -- --port=3001)
        for arg in {{.CLI_ARGS}}; do
          if [[ $arg == --port=* ]]; then
            PORT=${arg#--port=}
          fi
        done
        WEB_PORT=$PORT {{.DOCKER_COMPOSE}} up -d --build

  down:
    desc: Stop all containers
    cmds:
      - "{{.DOCKER_COMPOSE}} down"

  sh:
    desc: Open a shell inside the app container (interactive)
    cmds:
      - "{{.DOCKER_COMPOSE}} exec web sh"
    interactive: true

  logs:
    desc: Follow container logs (optional filter: task logs -- web)
    cmds:
      - "{{.DOCKER_COMPOSE}} logs -f {{.CLI_ARGS}}"

  migrate:data:
    desc: Execute pending data migrations
    cmds:
      - "{{.DOCKER_COMPOSE}} exec web pnpm --filter web run migrate:data"
